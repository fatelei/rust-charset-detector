name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install maturin
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "$RUNNER_OS" == "Windows" ]; then
          pip install maturin
        else
          pip install maturin[patchelf]
        fi

    - name: Build wheels
      run: maturin build --release --strip --out dist/

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: dist/*

  build-musllinux:
    name: Build musllinux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - musllinux_x86_64
          - musllinux_i686
          - musllinux_aarch64
    container:
      image: ghcr.io/pyo3/maturin:release-musllinux_x86_64
      options: --user root

    steps:
    - uses: actions/checkout@v4

    - name: Build wheels
      run: |
        maturin build --release --strip --out dist/ --manylinux 2010

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.target }}
        path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-musllinux]
    runs-on: ubuntu-latest
    environment:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist/

    - name: Download musllinux wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-musllinux
        path: dist/

    - name: List dist
      run: ls -la dist/

    - name: Install twine
      run: pip install twine

    - name: Check wheels
      run: twine check dist/*

    - name: Publish to PyPI
      if: success()
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
