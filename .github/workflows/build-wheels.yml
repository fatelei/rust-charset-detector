name: Build Wheels

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install maturin
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "$RUNNER_OS" == "Windows" ]; then
          pip install maturin
        else
          pip install maturin[patchelf]
        fi

    - name: Build wheel
      run: maturin build --release --strip --out dist/

    - name: Test wheel
      shell: bash
      run: |
        wheel_path=$(ls dist/*.whl 2>/dev/null | head -1)
        pip install "$wheel_path"
        pip install pytest
        pytest tests/ -v

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl

  build-musllinux:
    name: Build musllinux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - musllinux_x86_64
          - musllinux_i686
          - musllinux_aarch64
          - musllinux_ppc64le
          - musllinux_s390x
    container:
      image: ghcr.io/pyo3/maturin:release-musllinux_x86_64
      options: --user root

    steps:
    - uses: actions/checkout@v4

    - name: Build wheels
      run: |
        case "${{ matrix.target }}" in
          musllinux_x86_64)
            echo "Building for x86_64"
            ;;
          musllinux_i686)
            echo "Building for i686"
            ;;
          musllinux_aarch64)
            echo "Building for aarch64"
            ;;
          musllinux_ppc64le)
            echo "Building for ppc64le"
            ;;
          musllinux_s390x)
            echo "Building for s390x"
            ;;
        esac
        maturin build --release --strip --out dist/ --manylinux 2010

    - name: Upload musllinux wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.target }}
        path: dist/*.whl
