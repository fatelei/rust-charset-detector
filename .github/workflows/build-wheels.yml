name: Build Wheels

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install maturin
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "$RUNNER_OS" == "Windows" ]; then
          pip install maturin
        else
          pip install maturin[patchelf]
        fi

    - name: Build wheel
      run: maturin build --release --strip --out dist/

    - name: Test wheel
      shell: bash
      run: |
        wheel_path=$(ls dist/*.whl 2>/dev/null | head -1)
        pip install "$wheel_path"
        pip install pytest
        pytest tests/ -v

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl

  build-linux-wheels:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64
          - i686
          - aarch64
          - ppc64le
          - s390x

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      if: matrix.target != 'x86_64' && matrix.target != 'i686'
      uses: docker/setup-qemu-action@v3

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}-unknown-linux-gnu
        manylinux: auto
        args: --release --strip --out dist

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheel-linux-${{ matrix.target }}
        path: dist/*.whl
