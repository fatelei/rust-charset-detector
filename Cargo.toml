[package]
name = "charset-detector"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance character encoding detection library with Python bindings"
license = "MIT"
repository = "https://github.com/yourusername/rust-charset-detector"
keywords = ["charset", "encoding", "detection", "python"]
categories = ["text-processing", "internationalization"]

[lib]
name = "charset_detector"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3"], optional = true }
encoding_rs = "0.8"
once_cell = "1.19"

[features]
default = ["python"]
python = ["pyo3"]
